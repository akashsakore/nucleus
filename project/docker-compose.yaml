version: "3.8"

services:
  postgresdb:
    image: postgres:15
    container_name: postgresdb_container
      #restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nucleus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend_container
    restart: always
    depends_on:
      postgresdb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:root@postgresdb:5432/appdb
    ports:
      - 5000:5000
    networks:
      - nucleus

        # frontend:
        # build: ./frontend
        # container_name: frontend_container
        # restart: always
        # depends_on:
        #   - backend
        # ports:
        #   - 80:80
        # networks:
        #   - nucleus
        # volumes:
        #   - ./nginx.conf:/etc/nginx/conf.d/default.conf
        #   - ./frontend/dist:/usr/share/nginx/html
  nginx:
    image: nginx:latest
    container_name: nginx_container
    restart: always
    ports: 
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - nucleus

volumes:
  pgdata:

networks:
  nucleus:

